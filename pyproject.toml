[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai"
version = "0.1.0"
description = "Local-first coding assistant CLI harness for LM Studio (OpenAI-compatible local models)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Brian Anderson" }]
keywords = ["llm", "lm-studio", "cli", "coding-assistant", "local-first", "deepseek"]

dependencies = [
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "pathspec>=0.12.0",
    "tomli>=2.0.1; python_version < '3.11'",
    "tomli-w>=1.0.0",
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
local-ai = "local_ai.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["local_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
